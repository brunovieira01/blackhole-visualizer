<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <title>Black Hole Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="hud" class="hud">
    <div class="hud-title">BLACK&nbsp;HOLE<span class="dim">&nbsp;/&nbsp;VISUALIZER</span></div>
    <div class="hud-row"><span class="k">source</span><span class="v" id="hud-source">starting…</span></div>
    <div class="hud-row"><span class="k">mode</span><span class="v" id="hud-mode">—</span></div>
    <div class="hud-row"><span class="k">theme</span><span class="v" id="hud-theme">—</span></div>
    <div class="hud-row"><span class="k">fps</span><span class="v" id="hud-fps">—</span></div>
    <div class="hud-keys">
      <b>H</b> hud &nbsp; <b>1–6</b> theme &nbsp; <b>R</b> ring &nbsp; <b>W</b> wave<br />
      <b>↑↓</b> reactivity &nbsp; <b>drag</b> orbit &nbsp; <b>F</b> fullscreen
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
